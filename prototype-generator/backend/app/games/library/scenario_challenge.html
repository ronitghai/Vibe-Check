<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Azure Scenario Challenge</title>
<style>
  .wrap {
    width: 680px;
    max-width: 100%;
  }

  .scenario {
    background: var(--surface);
    padding: 18px;
    border-radius: var(--radius);
    margin: 12px 0;
  }

  .choices {
    display: grid;
    gap: 10px;
  }

  .choice {
    padding: 12px;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    background: var(--surface-2);
    color: var(--text);
    text-align: left;
    cursor: pointer;
  }

  .choice.correct {
    border-color: var(--success);
    background: var(--success-bg);
  }

  .choice.wrong {
    border-color: var(--danger);
    background: var(--danger-bg);
  }

  #feedback {
    display: none;
    margin-top: 14px;
    padding: 14px;
    border-left: 4px solid var(--accent);
    background: var(--surface);
  }

  #next {
    display: none;
    margin-top: 12px;
  }

  .meta {
    color: var(--text-muted);
    font-size: 13px;
  }
</style>
</head>
<body>
  <div class="wrap">
    <h1 class="game-title">Azure Scenario Challenge</h1>
    <div id="progress" class="meta"></div>
    <div id="scenario" class="scenario"></div>
    <div id="choices" class="choices"></div>
    <div id="feedback"></div>
    <button id="next" class="btn">Next scenario</button>
  </div>

<script>
(function () {
  // config.questions: [{question, choices: [4 strings], answerIndex, explanation}, ...]
  // — one realistic Azure decision scenario per question, generated by
  // learning/service.py's scenario-mode quiz generator (same generator as
  // rapid_quiz, just prompted for applied/scenario wording instead of
  // plain recall — see service.py's _generate_questions_from_snippets).
  var CONFIG = window.__CONFIG__ || {};
  var questions = CONFIG.questions || [];
  var current = 0;
  var correctCount = 0;
  var locked = false; // true between "an answer was picked" and "Next scenario" — blocks re-clicking choices

  var scenarioEl = document.getElementById("scenario");
  var choicesEl = document.getElementById("choices");
  var feedbackEl = document.getElementById("feedback");
  var nextBtn = document.getElementById("next");
  var progressEl = document.getElementById("progress");

  function render() {
    locked = false;
    feedbackEl.style.display = "none";
    nextBtn.style.display = "none";
    choicesEl.innerHTML = "";

    var q = questions[current];
    progressEl.textContent = "Scenario " + (current + 1) + " of " + questions.length;
    scenarioEl.textContent = q.question;

    q.choices.forEach(function (choiceText, choiceIndex) {
      var button = document.createElement("button");
      button.className = "choice";
      button.textContent = choiceText;
      button.onclick = function () {
        answer(choiceIndex, button);
      };
      choicesEl.appendChild(button);
    });
  }

  function answer(selectedIndex) {
    if (locked) return; // ignore extra clicks after the first answer this round
    locked = true;

    var q = questions[current];
    // Walk every rendered choice button (not just the one clicked) so the
    // correct answer is always highlighted green, even if the learner
    // picked a different (wrong) one — that's the whole point of showing
    // feedback here instead of just a right/wrong toast.
    Array.prototype.forEach.call(choicesEl.children, function (button, index) {
      if (index === q.answerIndex) {
        button.classList.add("correct");
      } else if (index === selectedIndex) {
        button.classList.add("wrong");
      }
    });

    if (selectedIndex === q.answerIndex) correctCount++;

    feedbackEl.innerHTML =
      "<strong>" + (selectedIndex === q.answerIndex ? "Correct" : "Review this concept") + "</strong><br>" +
      (q.explanation || "Review the related AZ-900 concept.");
    feedbackEl.style.display = "block";

    nextBtn.textContent = current === questions.length - 1 ? "Finish" : "Next scenario";
    nextBtn.style.display = "inline-block";
  }

  nextBtn.onclick = function () {
    current++;
    if (current < questions.length) {
      render();
      return;
    }
    // Ran out of scenarios — show the final tally and report the real
    // score up to the parent app (see games/bundle.py's reportGameResult;
    // this is what actually moves the AZ-900 mastery bar, not opening the
    // game).
    scenarioEl.textContent = "Challenge complete: " + correctCount + "/" + questions.length;
    choicesEl.innerHTML = "";
    feedbackEl.style.display = "none";
    nextBtn.style.display = "none";
    progressEl.textContent = "";
    if (window.reportGameResult) window.reportGameResult(correctCount, questions.length);
  };

  if (questions.length) {
    render();
  } else {
    scenarioEl.textContent = "No scenarios are available.";
  }
})();
</script>
</body>
</html>
