<!DOCTYPE html><html><head><meta charset="utf-8"><title>Azure Scenario Challenge</title><style>
.wrap{width:680px;max-width:100%}.scenario{background:var(--surface);padding:18px;border-radius:var(--radius);margin:12px 0}.choices{display:grid;gap:10px}.choice{padding:12px;border:1px solid var(--border);border-radius:var(--radius);background:var(--surface-2);color:var(--text);text-align:left;cursor:pointer}.choice.correct{border-color:var(--success);background:var(--success-bg)}.choice.wrong{border-color:var(--danger);background:var(--danger-bg)}#feedback{display:none;margin-top:14px;padding:14px;border-left:4px solid var(--accent);background:var(--surface)}#next{display:none;margin-top:12px}.meta{color:var(--text-muted);font-size:13px}
</style></head><body><div class="wrap"><h1 class="game-title">Azure Scenario Challenge</h1><div id="progress" class="meta"></div><div id="scenario" class="scenario"></div><div id="choices" class="choices"></div><div id="feedback"></div><button id="next" class="btn">Next scenario</button></div><script>
(function(){var C=window.__CONFIG__||{};var qs=C.questions||[];var i=0,correct=0,locked=false;var scenario=document.getElementById('scenario'),choices=document.getElementById('choices'),feedback=document.getElementById('feedback'),next=document.getElementById('next'),progress=document.getElementById('progress');function render(){locked=false;feedback.style.display='none';next.style.display='none';choices.innerHTML='';var q=qs[i];progress.textContent='Scenario '+(i+1)+' of '+qs.length;scenario.textContent=q.question;q.choices.forEach(function(c,idx){var b=document.createElement('button');b.className='choice';b.textContent=c;b.onclick=function(){answer(idx,b)};choices.appendChild(b)})}function answer(idx){if(locked)return;locked=true;var q=qs[i];Array.prototype.forEach.call(choices.children,function(b,n){if(n===q.answerIndex)b.classList.add('correct');else if(n===idx)b.classList.add('wrong')});if(idx===q.answerIndex)correct++;feedback.innerHTML='<strong>'+(idx===q.answerIndex?'Correct':'Review this concept')+'</strong><br>'+(q.explanation||'Review the related AZ-900 concept.');feedback.style.display='block';next.textContent=i===qs.length-1?'Finish':'Next scenario';next.style.display='inline-block'}next.onclick=function(){i++;if(i<qs.length)render();else{scenario.textContent='Challenge complete: '+correct+'/'+qs.length;choices.innerHTML='';feedback.style.display='none';next.style.display='none';progress.textContent='';if(window.reportGameResult)window.reportGameResult(correct,qs.length)}};if(qs.length)render();else scenario.textContent='No scenarios are available.'})();
</script></body></html>
