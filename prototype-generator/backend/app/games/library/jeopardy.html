<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Azure Jeopardy</title>

<style>
  .jeopardy-wrap {
    width: min(1100px, 100%);
    margin: 0 auto;
  }

  .jeopardy-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 20px;
    margin-bottom: 18px;
  }

  .header-copy {
    min-width: 0;
  }

  .header-stats {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    justify-content: flex-end;
  }

  .stat-card {
    min-width: 105px;
    padding: 10px 14px;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    background: var(--surface);
    text-align: center;
  }

  .stat-label {
    display: block;
    color: var(--text-muted);
    font-size: 12px;
    margin-bottom: 3px;
  }

  .stat-value {
    font-size: 18px;
    font-weight: 700;
  }

  .progress-track {
    height: 8px;
    width: 100%;
    background: var(--surface);
    border-radius: 999px;
    overflow: hidden;
    margin-bottom: 18px;
  }

  .progress-fill {
    width: 0%;
    height: 100%;
    background: var(--accent);
    transition: width 0.25s ease;
  }

  .board {
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: 10px;
  }

  .category-column {
    display: grid;
    grid-template-rows: auto repeat(4, minmax(82px, auto));
    gap: 8px;
    min-width: 0;
  }

  .category-heading {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 68px;
    padding: 10px;
    background: var(--accent-strong);
    border-radius: var(--radius);
    color: var(--text);
    font-size: 15px;
    font-weight: 700;
    text-align: center;
    line-height: 1.25;
  }

  .question-tile {
    appearance: none;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    background: var(--surface);
    color: var(--warning);
    min-height: 82px;
    padding: 12px;
    font-size: 22px;
    font-weight: 800;
    cursor: pointer;
    transition:
      transform 0.15s ease,
      background 0.15s ease,
      opacity 0.15s ease;
  }

  .question-tile:hover:not(:disabled) {
    transform: translateY(-2px);
    background: var(--surface-2);
  }

  .question-tile:focus-visible {
    outline: 3px solid var(--accent);
    outline-offset: 2px;
  }

  .question-tile.completed {
    opacity: 0.42;
    cursor: default;
    color: var(--text-muted);
  }

  .question-tile.correct-tile {
    background: var(--success-bg);
    border-color: var(--success);
  }

  .question-tile.wrong-tile {
    background: var(--danger-bg);
    border-color: var(--danger);
  }

  .overlay {
    position: fixed;
    inset: 0;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 20px;
    background: rgba(0, 0, 0, 0.74);
    z-index: 1000;
  }

  .overlay.open {
    display: flex;
  }

  .question-modal {
    width: min(680px, 100%);
    max-height: 90vh;
    overflow-y: auto;
    padding: 24px;
    border: 1px solid var(--border);
    border-radius: calc(var(--radius) + 4px);
    background: var(--surface);
  }

  .modal-meta {
    color: var(--warning);
    font-size: 14px;
    font-weight: 700;
    margin-bottom: 8px;
  }

  .modal-question {
    font-size: 23px;
    line-height: 1.35;
    font-weight: 700;
    margin-bottom: 20px;
  }

  .choice-list {
    display: grid;
    gap: 10px;
  }

  .answer-choice {
    width: 100%;
    padding: 14px;
    border: 2px solid transparent;
    border-radius: var(--radius);
    background: var(--surface-2);
    color: var(--text);
    cursor: pointer;
    text-align: left;
    font-size: 15px;
    line-height: 1.35;
  }

  .answer-choice:hover:not(:disabled) {
    border-color: var(--accent);
  }

  .answer-choice:disabled {
    cursor: default;
  }

  .answer-choice.correct-answer {
    background: var(--success-bg);
    border-color: var(--success);
  }

  .answer-choice.wrong-answer {
    background: var(--danger-bg);
    border-color: var(--danger);
  }

  .feedback {
    display: none;
    margin-top: 18px;
    padding: 15px;
    border-left: 4px solid var(--accent);
    background: var(--surface-2);
    line-height: 1.45;
  }

  .feedback.visible {
    display: block;
  }

  .feedback.correct {
    border-left-color: var(--success);
  }

  .feedback.wrong {
    border-left-color: var(--danger);
  }

  .modal-actions {
    display: flex;
    justify-content: flex-end;
    margin-top: 18px;
  }

  #continue-btn {
    display: none;
  }

  #continue-btn.visible {
    display: inline-block;
  }

  .final-panel {
    display: none;
    padding: 28px;
    border: 1px solid var(--border);
    border-radius: calc(var(--radius) + 4px);
    background: var(--surface);
    text-align: center;
  }

  .final-panel.visible {
    display: block;
  }

  .final-score {
    font-size: 32px;
    font-weight: 800;
    margin: 14px 0 8px;
  }

  .final-breakdown {
    margin-bottom: 20px;
    color: var(--text-muted);
    font-size: 16px;
  }

  @media (max-width: 800px) {
    .jeopardy-header {
      flex-direction: column;
    }

    .header-stats {
      width: 100%;
      justify-content: flex-start;
    }

    .board {
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }
  }

  @media (max-width: 520px) {
    .board {
      grid-template-columns: 1fr;
    }

    .category-column {
      grid-template-rows: auto;
    }

    .question-tile {
      min-height: 62px;
    }

    .question-modal {
      padding: 18px;
    }

    .modal-question {
      font-size: 19px;
    }
  }
</style>
</head>

<body>
<div class="jeopardy-wrap">
  <div id="game-view">
    <div class="jeopardy-header">
      <div class="header-copy">
        <h1 id="game-title" class="game-title">AZ-900 Jeopardy</h1>
        <div class="game-meta">
          Select a category and point value. Answer each Azure question and
          review the explanation.
        </div>
      </div>

      <div class="header-stats">
        <div class="stat-card">
          <span class="stat-label">Score</span>
          <span id="score-value" class="stat-value">$0</span>
        </div>

        <div class="stat-card">
          <span class="stat-label">Correct</span>
          <span id="correct-value" class="stat-value">0</span>
        </div>

        <div class="stat-card">
          <span class="stat-label">Progress</span>
          <span id="progress-value" class="stat-value">0 / 16</span>
        </div>
      </div>
    </div>

    <div class="progress-track">
      <div id="progress-fill" class="progress-fill"></div>
    </div>

    <div id="board" class="board"></div>
  </div>

  <div id="final-panel" class="final-panel">
    <h1 class="game-title">Board Complete!</h1>
    <div class="game-meta">
      You completed every Azure Jeopardy question.
    </div>

    <div id="final-score" class="final-score">$0</div>
    <div id="final-breakdown" class="final-breakdown"></div>

    <button id="restart-btn" class="btn">Play again</button>
  </div>
</div>

<div id="question-overlay" class="overlay" role="dialog" aria-modal="true">
  <div class="question-modal">
    <div id="modal-meta" class="modal-meta"></div>
    <div id="modal-question" class="modal-question"></div>

    <div id="choice-list" class="choice-list"></div>

    <div id="feedback" class="feedback"></div>

    <div class="modal-actions">
      <button id="continue-btn" class="btn">Return to board</button>
    </div>
  </div>
</div>

<script>
(function () {
  // CONFIG.categories: exactly 4 {name, questions: [{value, question, choices,
  // answerIndex, explanation}, ...]} entries, generated by
  // learning/service.py's jeopardy-mode generator. fallbackCategories below is
  // the curated backup registry.py ships as this game's `defaults` — used
  // as-is if CONFIG.categories is missing or doesn't have exactly 4 categories
  // (see the `categories =` assignment further down), same graceful-degrade
  // pattern as every other template (registry.py's merge_config).
  var CONFIG = window.__CONFIG__ || {};

  var fallbackCategories = [
    {
      name: "Cloud Models",
      questions: [
        {
          value: 100,
          question: "Which cloud model combines public and private cloud environments?",
          choices: ["Public cloud", "Private cloud", "Hybrid cloud", "Community cloud"],
          answerIndex: 2,
          explanation: "Hybrid cloud combines public and private cloud environments."
        },
        {
          value: 200,
          question: "Which cloud model is owned and operated entirely by one organization?",
          choices: ["Public cloud", "Private cloud", "Hybrid cloud", "Multicloud"],
          answerIndex: 1,
          explanation: "A private cloud is dedicated to a single organization."
        },
        {
          value: 300,
          question: "Which cloud model normally provides resources over the public internet?",
          choices: ["Public cloud", "Private cloud", "Hybrid cloud", "On-premises only"],
          answerIndex: 0,
          explanation: "Public cloud services are delivered over the internet by a cloud provider."
        },
        {
          value: 400,
          question: "A company keeps sensitive systems on-premises but uses Azure for additional capacity. Which model is this?",
          choices: ["Public cloud", "Private cloud", "Hybrid cloud", "SaaS"],
          answerIndex: 2,
          explanation: "Using on-premises resources together with public cloud services is hybrid cloud."
        }
      ]
    },
    {
      name: "Service Models",
      questions: [
        {
          value: 100,
          question: "Which service model provides virtual machines, networking, and storage?",
          choices: ["IaaS", "PaaS", "SaaS", "Serverless only"],
          answerIndex: 0,
          explanation: "Infrastructure as a Service provides foundational infrastructure resources."
        },
        {
          value: 200,
          question: "Which service model lets developers focus on applications while the provider manages the platform?",
          choices: ["IaaS", "PaaS", "SaaS", "Private cloud"],
          answerIndex: 1,
          explanation: "Platform as a Service manages the underlying infrastructure and development platform."
        },
        {
          value: 300,
          question: "Which service model delivers complete applications to users?",
          choices: ["IaaS", "PaaS", "SaaS", "Hybrid cloud"],
          answerIndex: 2,
          explanation: "Software as a Service provides complete applications managed by the provider."
        },
        {
          value: 400,
          question: "Which service model gives the customer the most responsibility for operating systems and applications?",
          choices: ["SaaS", "PaaS", "IaaS", "Consumption pricing"],
          answerIndex: 2,
          explanation: "With IaaS, customers manage operating systems, applications, and data."
        }
      ]
    },
    {
      name: "Cloud Benefits",
      questions: [
        {
          value: 100,
          question: "Which benefit means a service remains available despite failures?",
          choices: ["Elasticity", "High availability", "Governance", "CapEx"],
          answerIndex: 1,
          explanation: "High availability helps services remain accessible despite failures."
        },
        {
          value: 200,
          question: "Which benefit allows resources to increase or decrease based on demand?",
          choices: ["Scalability", "Compliance", "CapEx", "Private cloud"],
          answerIndex: 0,
          explanation: "Scalability allows capacity to change as demand changes."
        },
        {
          value: 300,
          question: "Which term describes automatically adjusting resources rapidly as demand changes?",
          choices: ["Reliability", "Elasticity", "Governance", "SaaS"],
          answerIndex: 1,
          explanation: "Elasticity is the ability to dynamically expand and reduce resources."
        },
        {
          value: 400,
          question: "Which cloud benefit helps organizations understand expected performance and costs?",
          choices: ["Predictability", "Availability zone", "Private cloud", "IaaS"],
          answerIndex: 0,
          explanation: "Predictability helps forecast performance and costs."
        }
      ]
    },
    {
      name: "Cloud Economics",
      questions: [
        {
          value: 100,
          question: "Which term describes upfront spending on physical infrastructure?",
          choices: ["OpEx", "CapEx", "Elasticity", "Governance"],
          answerIndex: 1,
          explanation: "Capital expenditure is upfront investment in physical assets."
        },
        {
          value: 200,
          question: "Which term describes ongoing spending for services as they are used?",
          choices: ["CapEx", "OpEx", "Availability", "PaaS"],
          answerIndex: 1,
          explanation: "Operational expenditure is ongoing spending for services and operations."
        },
        {
          value: 300,
          question: "Which cloud pricing approach charges customers based on actual usage?",
          choices: ["Fixed ownership model", "Consumption-based model", "Private model", "Capital model"],
          answerIndex: 1,
          explanation: "Consumption-based pricing means customers pay for the resources they use."
        },
        {
          value: 400,
          question: "Which cloud advantage reduces the need to buy and maintain physical datacenters?",
          choices: ["Increased CapEx", "Reduced infrastructure management", "Manual scaling", "Private DNS"],
          answerIndex: 1,
          explanation: "Cloud providers manage physical infrastructure, reducing customer maintenance responsibilities."
        }
      ]
    }
  ];

  var title = typeof CONFIG.title === "string" && CONFIG.title.trim()
    ? CONFIG.title.trim()
    : "AZ-900 Jeopardy";

  var categories =
    Array.isArray(CONFIG.categories) && CONFIG.categories.length === 4
      ? CONFIG.categories
      : fallbackCategories;

  var gameTitleEl = document.getElementById("game-title");
  var boardEl = document.getElementById("board");
  var scoreValueEl = document.getElementById("score-value");
  var correctValueEl = document.getElementById("correct-value");
  var progressValueEl = document.getElementById("progress-value");
  var progressFillEl = document.getElementById("progress-fill");

  var overlayEl = document.getElementById("question-overlay");
  var modalMetaEl = document.getElementById("modal-meta");
  var modalQuestionEl = document.getElementById("modal-question");
  var choiceListEl = document.getElementById("choice-list");
  var feedbackEl = document.getElementById("feedback");
  var continueBtn = document.getElementById("continue-btn");

  var gameViewEl = document.getElementById("game-view");
  var finalPanelEl = document.getElementById("final-panel");
  var finalScoreEl = document.getElementById("final-score");
  var finalBreakdownEl = document.getElementById("final-breakdown");
  var restartBtn = document.getElementById("restart-btn");

  var score = 0;
  var correctCount = 0;
  var answeredCount = 0;
  var totalQuestions = 0;
  var activeCategoryIndex = null;
  var activeQuestionIndex = null;
  var activeTile = null;
  var locked = false;
  var resultReported = false;

  categories.forEach(function (category) {
    if (Array.isArray(category.questions)) {
      totalQuestions += category.questions.length;
    }
  });

  // Refresh the scoreboard/progress bar from the module-level score/correctCount/
  // answeredCount variables — called after every answer and after resetGame, never
  // mutates state itself.
  function updateStats() {
    scoreValueEl.textContent = formatScore(score);
    correctValueEl.textContent = String(correctCount);
    progressValueEl.textContent = answeredCount + " / " + totalQuestions;

    var percentage = totalQuestions > 0
      ? Math.round((answeredCount / totalQuestions) * 100)
      : 0;

    progressFillEl.style.width = percentage + "%";
  }

  // Jeopardy-style money formatting — negative scores (wrong answers subtract
  // their tile's value) render as "-$100", not "$-100".
  function formatScore(value) {
    if (value < 0) {
      return "-$" + Math.abs(value);
    }

    return "$" + value;
  }

  // Rebuild the whole 4-column tile grid from `categories`, one <button> tile
  // per question. Full-rebuild rather than incremental update, called on
  // first load and again from resetGame — cheap enough at 4x4 tiles and
  // avoids tracking per-tile DOM state separately from `question.completed`.
  function renderBoard() {
    boardEl.innerHTML = "";

    categories.forEach(function (category, categoryIndex) {
      var column = document.createElement("section");
      column.className = "category-column";

      var heading = document.createElement("div");
      heading.className = "category-heading";
      heading.textContent = category.name;
      column.appendChild(heading);

      category.questions.forEach(function (question, questionIndex) {
        var tile = document.createElement("button");
        tile.className = "question-tile";
        tile.type = "button";
        tile.textContent = "$" + question.value;
        tile.dataset.categoryIndex = String(categoryIndex);
        tile.dataset.questionIndex = String(questionIndex);

        if (question.completed) {
          markCompletedTile(tile, question.wasCorrect);
        } else {
          tile.addEventListener("click", function () {
            openQuestion(categoryIndex, questionIndex, tile);
          });
        }

        column.appendChild(tile);
      });

      boardEl.appendChild(column);
    });
  }

  // Opens the question modal for one tile — the start of this game's
  // open -> submitAnswer -> closeQuestion state machine. `locked` here is left
  // over from a previous question if closeQuestion somehow didn't run; guard
  // against opening a second question modal on top of one still active.
  // Already-completed tiles are also click-guarded again here defensively
  // (renderBoard/markCompletedTile normally remove their click listener).
  function openQuestion(categoryIndex, questionIndex, tile) {
    if (locked) {
      return;
    }

    var category = categories[categoryIndex];
    var question = category.questions[questionIndex];

    if (question.completed) {
      return;
    }

    activeCategoryIndex = categoryIndex;
    activeQuestionIndex = questionIndex;
    activeTile = tile;
    locked = false;

    modalMetaEl.textContent =
      category.name + " • $" + question.value;

    modalQuestionEl.textContent = question.question;
    choiceListEl.innerHTML = "";

    feedbackEl.className = "feedback";
    feedbackEl.innerHTML = "";
    continueBtn.className = "btn";

    question.choices.forEach(function (choice, index) {
      var button = document.createElement("button");
      button.type = "button";
      button.className = "answer-choice";
      button.textContent = choice;

      button.addEventListener("click", function () {
        submitAnswer(index);
      });

      choiceListEl.appendChild(button);
    });

    overlayEl.classList.add("open");
  }

  // Scores the choice the learner clicked inside the open modal: adds the
  // tile's dollar value to `score` if correct, subtracts it if wrong (real
  // Jeopardy risk/reward), highlights the correct choice green and a wrong
  // pick red, then leaves the modal open showing feedback until closeQuestion
  // runs (via the Continue button).
  function submitAnswer(selectedIndex) {
    if (locked) {
      return;
    }

    locked = true;

    var category = categories[activeCategoryIndex];
    var question = category.questions[activeQuestionIndex];
    var wasCorrect = selectedIndex === question.answerIndex;
    var choiceButtons = choiceListEl.children;

    for (var i = 0; i < choiceButtons.length; i++) {
      choiceButtons[i].disabled = true;

      if (i === question.answerIndex) {
        choiceButtons[i].classList.add("correct-answer");
      } else if (i === selectedIndex) {
        choiceButtons[i].classList.add("wrong-answer");
      }
    }

    if (wasCorrect) {
      score += Number(question.value) || 0;
      correctCount += 1;
    } else {
      score -= Number(question.value) || 0;
    }

    answeredCount += 1;
    question.completed = true;
    question.wasCorrect = wasCorrect;

    feedbackEl.className =
      "feedback visible " + (wasCorrect ? "correct" : "wrong");

    feedbackEl.innerHTML =
      "<strong>" +
      (wasCorrect ? "Correct!" : "Not quite.") +
      "</strong><br>" +
      escapeHtml(
        question.explanation ||
          "Review this concept before continuing."
      );

    continueBtn.className = "btn visible";

    markCompletedTile(activeTile, wasCorrect);
    updateStats();
  }

  // Turns a board tile into its answered state (disabled, checkmark or X) —
  // shared by submitAnswer (answering live) and renderBoard (re-rendering a
  // tile that was already answered before a resetGame, though resetGame
  // clears `completed` so this second path is mostly defensive).
  function markCompletedTile(tile, wasCorrect) {
    tile.disabled = true;
    tile.classList.add("completed");
    tile.classList.add(wasCorrect ? "correct-tile" : "wrong-tile");
    tile.textContent = wasCorrect ? "✓" : "✕";
  }

  // Continue button handler — dismisses the modal and clears the
  // active-question state. If that was the last unanswered tile on the
  // board, hands off to finishGame instead of just returning to the board.
  function closeQuestion() {
    overlayEl.classList.remove("open");
    activeCategoryIndex = null;
    activeQuestionIndex = null;
    activeTile = null;
    locked = false;

    if (answeredCount >= totalQuestions) {
      finishGame();
    }
  }

  // All tiles answered — swap the board for the final-score panel and report
  // the real result up to the parent app (see games/bundle.py's
  // reportGameResult; this is what actually moves the AZ-900 mastery bar).
  // `resultReported` guards against double-reporting if this somehow runs
  // twice for the same playthrough.
  function finishGame() {
    gameViewEl.style.display = "none";
    finalPanelEl.classList.add("visible");

    var percent = totalQuestions > 0
      ? Math.round((correctCount / totalQuestions) * 100)
      : 0;

    finalScoreEl.textContent = formatScore(score);

    finalBreakdownEl.textContent =
      correctCount +
      " of " +
      totalQuestions +
      " correct • " +
      percent +
      "% accuracy";

    if (!resultReported && window.reportGameResult) {
      resultReported = true;
      window.reportGameResult(correctCount, totalQuestions);
    }
  }

  // "Play again" handler — zeroes all score/progress state, clears
  // `completed`/`wasCorrect` off every question so the board is fully
  // replayable, then re-renders. Does not reshuffle or refetch content;
  // it's the same categories/questions as this playthrough.
  function resetGame() {
    score = 0;
    correctCount = 0;
    answeredCount = 0;
    activeCategoryIndex = null;
    activeQuestionIndex = null;
    activeTile = null;
    locked = false;
    resultReported = false;

    categories.forEach(function (category) {
      category.questions.forEach(function (question) {
        question.completed = false;
        question.wasCorrect = false;
      });
    });

    finalPanelEl.classList.remove("visible");
    gameViewEl.style.display = "block";
    overlayEl.classList.remove("open");

    renderBoard();
    updateStats();
  }

  // question.explanation is LLM-generated text (or the hardcoded fallback)
  // that gets injected via innerHTML in submitAnswer's feedback message —
  // escape it through a throwaway element's textContent/innerHTML round-trip
  // so it can't break out as markup.
  function escapeHtml(value) {
    var div = document.createElement("div");
    div.textContent = String(value);
    return div.innerHTML;
  }

  continueBtn.addEventListener("click", closeQuestion);
  restartBtn.addEventListener("click", resetGame);

  gameTitleEl.textContent = title;

  renderBoard();
  updateStats();
})();
</script>
</body>
</html>
